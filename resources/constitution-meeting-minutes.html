            <div id="buttons">Loading…</div>
                <script>
                  document.addEventListener("DOMContentLoaded", () => {
                    const box = document.getElementById("buttons");

                    fetch("https://script.google.com/macros/s/AKfycbyvwccNnZ9ayCk9dwYalS96FrVrJOyJljyncxK0mxsudex5UJGPHjEPwj-M8tn_SI23KQ/exec")
                      .then(r => {
                        if (!r.ok) throw new Error("HTTP " + r.status);
                        return r.json();
                      })
                      .then(data => {
                        box.innerHTML = `
                          <a href="${data.exec}" target="_blank" rel="noopener">Latest Exec Minutes</a>
                          <a href="${data.house}" target="_blank" rel="noopener">Latest House Minutes</a>
                        `;
                      })
                      .catch(err => {
                        box.textContent = "Could not load minutes: " + err.message;
                        console.error(err);
                      });
                  });
